# systemd drop-in for the Ollama service: one request and one model at a time.
# AirSOAP runs its AI tasks one after another, and a 4 GB Pi cannot hold two models.
# Install:  sudo systemctl edit ollama   (paste the lines below), then
#           sudo systemctl restart ollama
[Service]
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
# Keep Ollama on loopback (this is also its default).
Environment="OLLAMA_HOST=127.0.0.1:11434"
