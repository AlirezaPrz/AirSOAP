[project]
name = "airsoap-backend"
version = "0.3.0"
description = "Local AirSOAP backend: microphone recording and on-device Whisper transcription"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncer>=0.0.8",
    "fastapi>=0.143",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "FAST", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# SQL statements read better unbroken.
"airsoap/auth/*.py" = ["E501"]
"airsoap/db/*.py" = ["E501"]
# Prompt templates are prose, not code: let their lines run long.
"airsoap/ai/tasks/*.py" = ["E501", "SIM905"]
# Polling loops are fine in tests.
"tests/**" = ["S101", "S105", "S106", "S603", "S108", "ASYNC109", "ASYNC110", "ASYNC240"]
